# CoreMesh single-host development, demo, and CI stack.
# Copy .env.example to .env and set POSTGRES_PASSWORD before using Compose.

name: coremesh

networks:
  coremesh-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  chroma-data:
  runtime-traces:

services:
  # -------------------------------------------------------------------------
  # PostgreSQL 16 — transaction metadata: prompt states, experiments, logs
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-coremesh}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-coremesh}"
    ports:
      - "${COREMESH_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-coremesh-bootstrap.sql:ro
    networks:
      - coremesh-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # -------------------------------------------------------------------------
  # Python runtime - app-profile HTTP runtime service for local/CI smoke tests
  # -------------------------------------------------------------------------
  runtime:
    profiles: ["app"]
    build:
      context: "${COREMESH_RUNTIME_CONTEXT:-./services-runtime}"
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_EXTRACTION_MODEL: "${OPENAI_EXTRACTION_MODEL:-gpt-4o-mini}"
      OPENAI_VISION_MODEL: "${OPENAI_VISION_MODEL:-gpt-4o}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"
      OPENAI_ARBITRATION_MODEL: "${OPENAI_ARBITRATION_MODEL:-gpt-4o-mini}"
      OPENAI_ADJUDICATOR_MODEL: "${OPENAI_ADJUDICATOR_MODEL:-gpt-4o-mini}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_ARBITRATION_MODEL: "${ANTHROPIC_ARBITRATION_MODEL:-claude-3-5-sonnet-latest}"
      OLLAMA_BASE_URL: "${RUNTIME_OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_ARBITRATION_MODEL: "${OLLAMA_ARBITRATION_MODEL:-llama3.1}"
      ARBITRATION_MODE: "${ARBITRATION_MODE:-external}"
      ARBITRATION_SCORE_THRESHOLD: "${ARBITRATION_SCORE_THRESHOLD:-4}"
      ARBITRATION_RETRY_ATTEMPTS: "${ARBITRATION_RETRY_ATTEMPTS:-2}"
      ARBITRATION_TIMEOUT_SECONDS: "${ARBITRATION_TIMEOUT_SECONDS:-30}"
      OCR_VARIANCE_THRESHOLD: "${OCR_VARIANCE_THRESHOLD:-0.08}"
      OCR_EASYOCR_ENABLED: "${OCR_EASYOCR_ENABLED:-true}"
      TESSERACT_CMD: "${TESSERACT_CMD:-}"
      POPPLER_PATH: "${POPPLER_PATH:-}"
      POSTGRES_DSN: "postgresql://${POSTGRES_USER:-coremesh}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coremesh}"
      PRODUCTION_INTERACTION_LOGGING_ENABLED: "${PRODUCTION_INTERACTION_LOGGING_ENABLED:-false}"
      PRODUCTION_LOG_REDACTION_PATTERNS: "${PRODUCTION_LOG_REDACTION_PATTERNS:-[]}"
      PRODUCTION_LOG_CONNECT_TIMEOUT_SECONDS: "${PRODUCTION_LOG_CONNECT_TIMEOUT_SECONDS:-3}"
      PRODUCTION_LOG_STATEMENT_TIMEOUT_MS: "${PRODUCTION_LOG_STATEMENT_TIMEOUT_MS:-3000}"
      REDIS_URL: "redis://redis:6379"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-coremesh_chunks}"
      QDRANT_VECTOR_SIZE: "${QDRANT_VECTOR_SIZE:-1536}"
      RERANKER_MODEL: "${RERANKER_MODEL:-BAAI/bge-reranker-large}"
      RAG_EMBEDDING_PROVIDER: "${RAG_EMBEDDING_PROVIDER:-openai}"
      RAG_RERANKER_PROVIDER: "${RAG_RERANKER_PROVIDER:-cross_encoder}"
      RAG_DENSE_WEIGHT: "${RAG_DENSE_WEIGHT:-1.0}"
      RAG_SPARSE_WEIGHT: "${RAG_SPARSE_WEIGHT:-1.0}"
      RAG_KEYWORD_PRIORITY: "${RAG_KEYWORD_PRIORITY:-true}"
      CHROMA_PERSIST_DIRECTORY: /app/.chroma/coremesh-agents
      CHROMA_COLLECTION: "${CHROMA_COLLECTION:-coremesh_agent_memory}"
      AGENT_MEMORY_TTL_SECONDS: "${AGENT_MEMORY_TTL_SECONDS:-3600}"
      FORENSICS_ENABLED: "${FORENSICS_ENABLED:-true}"
      FORENSICS_TRACE_DIRECTORY: /app/.traces
      FORENSICS_REGISTRY_PATH: /app/.traces/registry.sqlite3
      FORENSICS_CONFIDENCE_THRESHOLD: "${FORENSICS_CONFIDENCE_THRESHOLD:-0.60}"
      FORENSICS_CONFIDENCE_DROP_THRESHOLD: "${FORENSICS_CONFIDENCE_DROP_THRESHOLD:-0.20}"
      FORENSICS_MAX_ATTRIBUTE_LENGTH: "${FORENSICS_MAX_ATTRIBUTE_LENGTH:-256}"
      COREMESH_CHAT_STUB: "${COREMESH_CHAT_STUB:-false}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-coremesh-runtime}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    ports:
      - "${COREMESH_BIND_ADDRESS:-127.0.0.1}:${RUNTIME_HOST_PORT:-8000}:8000"
    volumes:
      - chroma-data:/app/.chroma
      - runtime-traces:/app/.traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - coremesh-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # -------------------------------------------------------------------------
  # Go gateway - app-profile edge proxy in front of the Python runtime
  # -------------------------------------------------------------------------
  gateway:
    profiles: ["app"]
    build:
      context: "${COREMESH_GATEWAY_CONTEXT:-./gateway-proxy}"
    restart: unless-stopped
    environment:
      GATEWAY_PRIMARY_URL: "http://runtime:8000"
      GATEWAY_FALLBACK_URL: "http://runtime:8000"
      REDIS_URL: "redis://redis:6379"
      POSTGRES_DSN: "postgresql://${POSTGRES_USER:-coremesh}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coremesh}"
      RATE_LIMIT_CAPACITY: "${RATE_LIMIT_CAPACITY:-100}"
      RATE_LIMIT_REFILL_PER_SECOND: "${RATE_LIMIT_REFILL_PER_SECOND:-20}"
      CIRCUIT_FAILURE_THRESHOLD: "${CIRCUIT_FAILURE_THRESHOLD:-5}"
      CIRCUIT_FAILURE_WINDOW: "${CIRCUIT_FAILURE_WINDOW:-30s}"
      CIRCUIT_OPEN_DURATION: "${CIRCUIT_OPEN_DURATION:-30s}"
      GATEWAY_ALLOWED_ORIGINS: "${GATEWAY_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      AUTOPILOT_ENABLED: "${AUTOPILOT_ENABLED:-true}"
      AUTOPILOT_TIER1_MODEL: "${AUTOPILOT_TIER1_MODEL:-gpt-4o-mini}"
      AUTOPILOT_TIER3_MODEL: "${AUTOPILOT_TIER3_MODEL:-gpt-4o}"
      AUTOPILOT_EXPERIMENT_FLAG: "${AUTOPILOT_EXPERIMENT_FLAG:-cost_autopilot_routing}"
      AUTOPILOT_EXPERIMENT_LOOKUP_TIMEOUT: "${AUTOPILOT_EXPERIMENT_LOOKUP_TIMEOUT:-2s}"
      AUTOPILOT_DEBUG: "${AUTOPILOT_DEBUG:-false}"
      SEMANTIC_CACHE_ENABLED: "${SEMANTIC_CACHE_ENABLED:-false}"
      SEMANTIC_CACHE_EMBEDDING_PROVIDER: "${SEMANTIC_CACHE_EMBEDDING_PROVIDER:-openai}"
      SEMANTIC_CACHE_THRESHOLD: "${SEMANTIC_CACHE_THRESHOLD:-0.96}"
      SEMANTIC_CACHE_TTL: "${SEMANTIC_CACHE_TTL:-24h}"
      SEMANTIC_CACHE_INDEX: "${SEMANTIC_CACHE_INDEX:-coremesh_semantic_cache}"
      SEMANTIC_CACHE_KEY_PREFIX: "${SEMANTIC_CACHE_KEY_PREFIX:-coremesh:semantic:entry:}"
      SEMANTIC_CACHE_VECTOR_DIM: "${SEMANTIC_CACHE_VECTOR_DIM:-1536}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"
    ports:
      - "${COREMESH_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      runtime:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - coremesh-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 && wget -qO- http://localhost:8080/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # -------------------------------------------------------------------------
  # React dashboard - app-profile execution, observability, and trace viewer
  # -------------------------------------------------------------------------
  frontend:
    profiles: ["app"]
    build:
      context: "${COREMESH_FRONTEND_CONTEXT:-./frontend-ui}"
      args:
        VITE_GATEWAY_BASE_URL: ${VITE_GATEWAY_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${COREMESH_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - coremesh-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # -------------------------------------------------------------------------
  # Phase 4.1 log miner — opt-in daily production-failure curation
  # -------------------------------------------------------------------------
  log-miner:
    profiles: ["analytics"]
    build:
      context: "${COREMESH_ANALYTICS_CONTEXT:-./analytics-workers}"
    restart: unless-stopped
    environment:
      POSTGRES_DSN: "postgresql://${POSTGRES_USER:-coremesh}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coremesh}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LOG_MINER_EMBEDDING_MODEL: "${LOG_MINER_EMBEDDING_MODEL:-text-embedding-3-small}"
      LOG_MINER_REFERENCE_MODEL: "${LOG_MINER_REFERENCE_MODEL:-gpt-4o}"
      LOG_MINER_EMBEDDING_BATCH_SIZE: "${LOG_MINER_EMBEDDING_BATCH_SIZE:-128}"
      LOG_MINER_PROVIDER_RETRY_ATTEMPTS: "${LOG_MINER_PROVIDER_RETRY_ATTEMPTS:-3}"
      LOG_MINER_WINDOW_DAYS: "${LOG_MINER_WINDOW_DAYS:-30}"
      LOG_MINER_RETENTION_DAYS: "${LOG_MINER_RETENTION_DAYS:-30}"
      LOG_MINER_SCORE_THRESHOLD: "${LOG_MINER_SCORE_THRESHOLD:-4}"
      LOG_MINER_MIN_CLUSTER_SIZE: "${LOG_MINER_MIN_CLUSTER_SIZE:-3}"
      LOG_MINER_MIN_SAMPLES: "${LOG_MINER_MIN_SAMPLES:-2}"
      LOG_MINER_CLUSTER_METRIC: "${LOG_MINER_CLUSTER_METRIC:-euclidean}"
      LOG_MINER_CLUSTER_SELECTION_METHOD: "${LOG_MINER_CLUSTER_SELECTION_METHOD:-eom}"
      LOG_MINER_MAX_NOISE_PER_FEATURE: "${LOG_MINER_MAX_NOISE_PER_FEATURE:-20}"
      LOG_MINER_MAX_CLUSTER_EXAMPLES: "${LOG_MINER_MAX_CLUSTER_EXAMPLES:-3}"
      LOG_MINER_PROMOTION_CONFIDENCE: "${LOG_MINER_PROMOTION_CONFIDENCE:-0.80}"
      LOG_MINER_FINGERPRINT_VERSION: "${LOG_MINER_FINGERPRINT_VERSION:-1.0}"
      LOG_MINER_LEASE_TTL_SECONDS: "${LOG_MINER_LEASE_TTL_SECONDS:-300}"
      LOG_MINER_HEARTBEAT_INTERVAL_SECONDS: "${LOG_MINER_HEARTBEAT_INTERVAL_SECONDS:-60}"
      LOG_MINER_CRON: "${LOG_MINER_CRON:-0 2 * * *}"
      LOG_MINER_TIMEZONE: "${LOG_MINER_TIMEZONE:-UTC}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coremesh-net
    healthcheck:
      test: ["CMD", "python", "-m", "src.log_miner.extractor", "check"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # -------------------------------------------------------------------------
  # Redis 7.2 — token buckets, semantic embedding cache (HNSW via RedisStack)
  # -------------------------------------------------------------------------
  redis:
    image: redis/redis-stack:7.2.0-v12
    restart: unless-stopped
    command: >
      redis-stack-server
      --appendonly yes
      --appendfsync everysec
      --protected-mode no
    ports:
      - "${COREMESH_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
      - "${COREMESH_BIND_ADDRESS:-127.0.0.1}:${REDISINSIGHT_HOST_PORT:-8001}:8001"
    volumes:
      - redis-data:/data
    networks:
      - coremesh-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # -------------------------------------------------------------------------
  # Qdrant — enterprise document index: sparse/dense spatial indices
  # -------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${COREMESH_BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_HOST_PORT:-6333}:6333"
      - "${COREMESH_BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - coremesh-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
