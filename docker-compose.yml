# Module: local CoreMesh development and CI stack.
# Role: supplies PostgreSQL metadata, Redis rate-limit/cache state, Qdrant
# vectors, optional app services, and an opt-in scheduled analytics worker.
# Dependencies: Docker Compose, referenced images, init.sql, and the analytics
# worker/runtime/gateway build contexts when their profiles are enabled.
# Side effects: creates named persistent volumes, a bridge network, containers,
# and host port bindings. PostgreSQL runs init.sql only for a new data volume.

networks:
  coremesh-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  qdrant-data:

services:
  # -------------------------------------------------------------------------
  # PostgreSQL 16 — transaction metadata: prompt states, experiments, logs
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: coremesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coremesh
      POSTGRES_PASSWORD: coremesh_secret
      POSTGRES_DB: coremesh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - coremesh-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coremesh -d coremesh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------------------------------------------------------
  # Python runtime - app-profile HTTP runtime service for local/CI smoke tests
  # -------------------------------------------------------------------------
  runtime:
    profiles: ["app"]
    build:
      context: "${COREMESH_RUNTIME_CONTEXT:-./services-runtime}"
    container_name: coremesh-runtime
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EXTRACTION_MODEL: ${OPENAI_EXTRACTION_MODEL:-gpt-4o-mini}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      COREMESH_CHAT_STUB: ${COREMESH_CHAT_STUB:-}
      POSTGRES_DSN: ${RUNTIME_POSTGRES_DSN:-postgresql://coremesh:coremesh_secret@postgres:5432/coremesh}
      PRODUCTION_INTERACTION_LOGGING_ENABLED: ${PRODUCTION_INTERACTION_LOGGING_ENABLED:-false}
      REDIS_URL: ${RUNTIME_REDIS_URL:-redis://redis:6379}
      QDRANT_URL: ${RUNTIME_QDRANT_URL:-http://qdrant:6333}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - coremesh-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # -------------------------------------------------------------------------
  # Go gateway - app-profile edge proxy in front of the Python runtime
  # -------------------------------------------------------------------------
  gateway:
    profiles: ["app"]
    build:
      context: "${COREMESH_GATEWAY_CONTEXT:-./gateway-proxy}"
    container_name: coremesh-gateway
    restart: unless-stopped
    environment:
      GATEWAY_PRIMARY_URL: ${GATEWAY_PRIMARY_URL:-http://runtime:8000}
      GATEWAY_FALLBACK_URL: ${GATEWAY_FALLBACK_URL:-http://runtime:8000}
      REDIS_URL: ${GATEWAY_REDIS_URL:-redis://redis:6379}
      POSTGRES_DSN: ${GATEWAY_POSTGRES_DSN:-postgresql://coremesh:coremesh_secret@postgres:5432/coremesh}
      AUTOPILOT_ENABLED: ${AUTOPILOT_ENABLED:-true}
      AUTOPILOT_TIER1_MODEL: ${AUTOPILOT_TIER1_MODEL:-gpt-4o-mini}
      AUTOPILOT_TIER3_MODEL: ${AUTOPILOT_TIER3_MODEL:-gpt-4o}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-false}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-100}
      RATE_LIMIT_REFILL_PER_SECOND: ${RATE_LIMIT_REFILL_PER_SECOND:-20}
    ports:
      - "8080:8080"
    depends_on:
      runtime:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - coremesh-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # -------------------------------------------------------------------------
  # Phase 4.1 log miner — opt-in daily production-failure curation
  # -------------------------------------------------------------------------
  log-miner:
    profiles: ["analytics"]
    build:
      context: ./analytics-workers
    container_name: coremesh-log-miner
    restart: unless-stopped
    environment:
      POSTGRES_DSN: ${LOG_MINER_POSTGRES_DSN:-postgresql://coremesh:coremesh_secret@postgres:5432/coremesh}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_MINER_EMBEDDING_MODEL: ${LOG_MINER_EMBEDDING_MODEL:-text-embedding-3-small}
      LOG_MINER_REFERENCE_MODEL: ${LOG_MINER_REFERENCE_MODEL:-gpt-4o}
      LOG_MINER_EMBEDDING_BATCH_SIZE: ${LOG_MINER_EMBEDDING_BATCH_SIZE:-128}
      LOG_MINER_PROVIDER_RETRY_ATTEMPTS: ${LOG_MINER_PROVIDER_RETRY_ATTEMPTS:-3}
      LOG_MINER_WINDOW_DAYS: ${LOG_MINER_WINDOW_DAYS:-30}
      LOG_MINER_RETENTION_DAYS: ${LOG_MINER_RETENTION_DAYS:-30}
      LOG_MINER_SCORE_THRESHOLD: ${LOG_MINER_SCORE_THRESHOLD:-4}
      LOG_MINER_MIN_CLUSTER_SIZE: ${LOG_MINER_MIN_CLUSTER_SIZE:-3}
      LOG_MINER_MIN_SAMPLES: ${LOG_MINER_MIN_SAMPLES:-2}
      LOG_MINER_CLUSTER_METRIC: ${LOG_MINER_CLUSTER_METRIC:-euclidean}
      LOG_MINER_CLUSTER_SELECTION_METHOD: ${LOG_MINER_CLUSTER_SELECTION_METHOD:-eom}
      LOG_MINER_MAX_NOISE_PER_FEATURE: ${LOG_MINER_MAX_NOISE_PER_FEATURE:-20}
      LOG_MINER_MAX_CLUSTER_EXAMPLES: ${LOG_MINER_MAX_CLUSTER_EXAMPLES:-3}
      LOG_MINER_PROMOTION_CONFIDENCE: ${LOG_MINER_PROMOTION_CONFIDENCE:-0.80}
      LOG_MINER_FINGERPRINT_VERSION: ${LOG_MINER_FINGERPRINT_VERSION:-1.0}
      LOG_MINER_LEASE_TTL_SECONDS: ${LOG_MINER_LEASE_TTL_SECONDS:-300}
      LOG_MINER_HEARTBEAT_INTERVAL_SECONDS: ${LOG_MINER_HEARTBEAT_INTERVAL_SECONDS:-60}
      LOG_MINER_CRON: ${LOG_MINER_CRON:-0 2 * * *}
      LOG_MINER_TIMEZONE: ${LOG_MINER_TIMEZONE:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coremesh-net

  # -------------------------------------------------------------------------
  # Redis 7.2 — token buckets, semantic embedding cache (HNSW via RedisStack)
  # -------------------------------------------------------------------------
  redis:
    image: redis/redis-stack:7.2.0-v12
    container_name: coremesh-redis
    restart: unless-stopped
    command: >
      redis-stack-server
      --appendonly yes
      --appendfsync everysec
      --protected-mode no
    ports:
      - "127.0.0.1:6379:6379"   # Redis
      - "127.0.0.1:8001:8001"   # RedisInsight UI
    volumes:
      - redis-data:/data
    networks:
      - coremesh-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------------
  # Qdrant — enterprise document index: sparse/dense spatial indices
  # -------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: coremesh-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - coremesh-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':</dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
